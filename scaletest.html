<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Stacking Balance Scale</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #f4f7f6;
    padding-top: 50px;
  }
  
  .scale-container {
    position: relative;
    width: 500px;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    margin-top: 50px;
  }
  
  .base {
    width: 24px;
    height: 160px;
    background: #333;
    position: absolute;
    bottom: 0;
    border-radius: 4px 4px 0 0;
  }
  
  .beam {
    width: 420px;
    height: 14px;
    background: #555;
    position: absolute;
    bottom: 160px;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-origin: center;
  }
  
  .beam::before {
    content: '';
    position: absolute;
    width: 24px;
    height: 24px;
    background: #222;
    border-radius: 50%;
    top: -5px;
    left: 198px;
  }
  
  /* Pans hang from the beam ends */
  .pan-left, .pan-right {
    position: absolute;
    width: 120px;
    top: 7px; /* Hangs from the beam */
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: top center;
    /* Keeps the pans perfectly upright while the beam tilts */
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  }
  .pan-left { left: 10px; }
  .pan-right { right: 10px; }

  .strings {
    width: 80px;
    height: 100px;
    border-left: 2px solid #888;
    border-right: 2px solid #888;
    position: relative;
  }
  
  /* Invisible container inside strings to build the icon stack upwards */
  .icon-stack {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column-reverse; /* Builds stack from bottom to top */
    align-items: center;
    gap: -5px; /* Slight overlap for tight stacking */
  }
  
  .stacked-icon {
    font-size: 28px;
    line-height: 1;
    margin-bottom: -2px; /* Tightens the visual stack */
    filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.15));
  }

  .plate {
    width: 110px;
    height: 12px;
    background: #aaa;
    border-radius: 0 0 12px 12px;
    border-top: 2px solid #888;
  }
</style>
</head>
<body>

<div class="scale-container">
  <div class="base"></div>
  
  <div class="beam" id="beam">
    
    <!-- Left Pan -->
    <div class="pan-left" id="pan-left">
      <div class="strings">
        <div class="icon-stack" id="left-stack"></div>
      </div>
      <div class="plate"></div>
    </div>
    
    <!-- Right Pan -->
    <div class="pan-right" id="pan-right">
      <div class="strings">
        <div class="icon-stack" id="right-stack"></div>
      </div>
      <div class="plate"></div>
    </div>
    
  </div>
</div>

<script>
  // Define your default config here
  const CONFIG = {
    leftIcon: '🍎',
    rightIcon: '📦',
    maxTilt: 22 // Max rotation angle in degrees
  };

  function initScale() {
    // 1. Parse numbers from the URL parameters (?left=X&right=Y)
    const urlParams = new URLSearchParams(window.location.search);
    const leftCount = parseInt(urlParams.get('left')) || 0;
    const rightCount = parseInt(urlParams.get('right')) || 0;

    // 2. Generate the visual icon stacks
    buildStack('left-stack', CONFIG.leftIcon, leftCount);
    buildStack('right-stack', CONFIG.rightIcon, rightCount);

    // 3. Calculate physics and angle
    const beam = document.getElementById('beam');
    const pLeft = document.getElementById('pan-left');
    const pRight = document.getElementById('pan-right');
    
    let tilt = 0;
    if (leftCount > rightCount) {
      tilt = -CONFIG.maxTilt;
    } else if (rightCount > leftCount) {
      tilt = CONFIG.maxTilt;
    }

    // 4. Apply counter-rotation to pans so they remain vertically straight
    beam.style.transform = `rotate(${tilt}deg)`;
    pLeft.style.transform = `rotate(${-tilt}deg)`;
    pRight.style.transform = `rotate(${-tilt}deg)`;
  }

  function buildStack(elementId, icon, count) {
    const container = document.getElementById(elementId);
    container.innerHTML = ''; // Clear previous items
    
    for (let i = 0; i < count; i++) {
      const iconDiv = document.createElement('div');
      iconDiv.className = 'stacked-icon';
      iconDiv.textContent = icon;
      container.appendChild(iconDiv);
    }
  }

  // Run the function when the page loads
  window.onload = initScale;
</script>

</body>
</html>
