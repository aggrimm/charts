<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUI Balance Test</title>
  <style>
    :root {
      --green: #39b832;
      --yellow: #ffc323;
      --red: #d82121;
      --ink: #222;
      --muted: #676767;
      --paper: #fbfaf7;
      --panel: #ffffff;
      --line: #252525;
      --shadow: 0 14px 34px rgba(30, 30, 30, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.55rem, 2.4vw, 2.35rem);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 680px;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid #dedbd2;
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(30, 30, 30, 0.06);
    }

    label {
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
    }

    select {
      min-width: 155px;
      border: 1px solid #cfcabf;
      border-radius: 7px;
      background: white;
      color: var(--ink);
      font: inherit;
      padding: 8px 34px 8px 10px;
    }

    .board {
      display: grid;
      gap: 18px;
    }

    .balance {
      position: relative;
      min-height: 420px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid #e1ded5;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .balance-svg {
      display: block;
      width: 100%;
      height: 420px;
    }

    .beam {
      transform: rotate(0deg);
      transform-box: fill-box;
      transform-origin: 50% 50%;
      transition: transform 720ms cubic-bezier(.2, .8, .2, 1);
      transition-delay: 0ms;
    }

    .balance.settled .beam {
      transform: rotate(var(--tilt));
    }

    .icon-face {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 720ms cubic-bezier(.2, .8, .2, 1);
      transition-delay: 0ms;
    }

    .balance.settled .beam .icon-face {
      transform: rotate(var(--counter-tilt));
    }

    .beam-line {
      stroke: var(--line);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .fulcrum {
      fill: #56514c;
      stroke: var(--line);
      stroke-width: 3;
    }

    .year-label {
      fill: #fff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      text-anchor: middle;
    }

    .plate-zone {
      fill: transparent;
      pointer-events: none;
    }

    .icon-node {
      cursor: pointer;
      opacity: 0;
      transition: transform 180ms ease, opacity 180ms ease;
      transform-box: fill-box;
      transform-origin: center;
      animation: dropIcon 620ms cubic-bezier(.18, .9, .3, 1.08) forwards;
      animation-delay: var(--drop-delay, 0ms);
    }

    .icon-node:hover {
      transform: translateY(-4px) scale(1.06);
    }

    @keyframes dropIcon {
      0% {
        opacity: 0;
        transform: translateY(-280px) scale(0.98);
      }
      16% {
        opacity: 1;
      }
      78% {
        transform: translateY(5px) scale(1);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .beam {
        transition: none;
      }

      .icon-face {
        transition: none;
      }

      .icon-node {
        animation: none;
        opacity: 1;
      }
    }

    .icon-disc {
      stroke: none;
    }

    .icon-art {
      fill: none;
      stroke: #fff;
      stroke-width: 4.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-fill {
      fill: #fff;
      stroke: none;
    }

    .green {
      fill: var(--green);
    }

    .yellow {
      fill: var(--yellow);
    }

    .red {
      fill: var(--red);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 20px;
      width: fit-content;
      max-width: 100%;
      margin: 18px auto 0;
      padding: 11px 16px;
      background: white;
      border: 2px solid #222;
      font-size: 0.83rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .swatch {
      display: inline-block;
      width: 30px;
      height: 20px;
      border-radius: 999px;
    }

    .detail {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .status-list {
      min-height: 112px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e1ded5;
      border-radius: 8px;
    }

    .status-list h2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 8px;
      font-size: 0.92rem;
    }

    .status-list p {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .status-list ul {
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.35;
      list-style: none;
    }

    .status-list li + li {
      margin-top: 5px;
    }

    .tooltip {
      position: fixed;
      z-index: 4;
      max-width: 260px;
      padding: 8px 10px;
      color: #fff;
      background: rgba(25, 25, 25, 0.9);
      border-radius: 7px;
      font-size: 0.82rem;
      line-height: 1.35;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, calc(-100% - 12px));
      transition: opacity 120ms ease;
    }

    .tooltip.visible {
      opacity: 1;
    }

    @media (max-width: 760px) {
      main {
        width: min(1120px, calc(100% - 18px));
        padding: 8px 0 16px;
      }

      header {
        display: block;
      }

      .controls {
        width: 100%;
        min-width: 0;
        margin-top: 14px;
        align-items: stretch;
        flex-direction: column;
        justify-content: space-between;
      }

      select {
        width: 100%;
        min-width: 0;
      }

      .balance {
        min-height: 0;
      }

      .balance-svg {
        height: auto;
        aspect-ratio: 1000 / 440;
      }

      .detail {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .legend {
        justify-content: start;
        width: 100%;
      }

      .legend-item {
        white-space: normal;
      }
    }

    @media (max-width: 420px) {
      .detail {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="board" id="board" aria-live="polite"></section>

    <div class="legend" aria-label="Status legend">
      <span class="legend-item"><span class="swatch" style="background: var(--red)"></span>Impaired</span>
      <span class="legend-item"><span class="swatch" style="background: var(--green)"></span>Impairment removed</span>
    </div>

    <section class="detail" id="detail" aria-label="Selected class summary"></section>
  </main>

  <div class="tooltip" id="tooltip" role="status"></div>

      ["rouge", "RHRRHRRRHRRHHR"],
      ["saginaw", "RGRHRRRRGRRHRG"],
      ["severn", "GHGHHHGGHHGHHG"],
      ["sheboygan", "RHRRRGGGHHHHGR"],
      ["spanishharbour", "RHGHGRGHHGHGGG"],
      ["stclair-can", "RGRGGRGHGGGGHR"],
      ["stclair-us", "RGGHGHGHRGGGHG"],
      ["stlawrence-can", "RGRRGGGRGGGGRR"],
      ["stlawrence-us", "RHRRRRHHHHHHGR"],
      ["stlouis", "RHGGHRRGHRGHHR"],
      ["stmarys-can", "RHGRGRGGHGGHHR"],
      ["stmarys-us", "RHGRGRGGHGGHHG"],
      ["thunderbay", "RHGGGRGHHGGGGR"],
      ["torchlake", "RHHGHRHHHHHHHH"],
      ["toronto", "RHRGGGGRHRGHRR"],
      ["waukegan", "RHHHHGGHHGHHGG"],
      ["wheatley", "GHGHHGGGHHHHHG"],
      ["whitelake", "GHGHHGGGGHGHHG"]
    ];

    const STATUS_CODES = { R: "red", G: "green", H: "hidden" };

    const CLASSES = Object.fromEntries(SITE_STATUS_ROWS.map(([id, codes]) => {
      const current = Object.fromEntries(ICONS.map((icon, index) => [icon.id, STATUS_CODES[codes[index]]]));
      const start = Object.fromEntries(ICONS.map(icon => [
        icon.id,
        current[icon.id] === "hidden" ? "hidden" : "red"
      ]));

      return [id, {
        name: SITE_NAMES[id],
        startYear: id === "presqueisle" ? 1991 : 1987,
        balances: { start, current }
      }];
    }));

    const CLASS_ALIASES = {
      "ashtabula-river": "ashtabula",
      "bay-of-quinte": "bayofquinte",
      "black-river": "blackriver"
    };

    const STATUS_LABELS = {
      green: "Impairment removed",
      red: "Impaired",
      hidden: "Never designated as impaired"
    };

    const HIDDEN_STATUSES = new Set(["hidden", "none", "not_shown", "notshown", "not-applicable", "not_applicable", "na", "n/a"]);

    const board = document.querySelector("#board");
    const detail = document.querySelector("#detail");
    const tooltip = document.querySelector("#tooltip");
    let activeClassId = getClassId();
    let animationTimer;
    let heightFrame;

    function getClassId() {
      const params = new URLSearchParams(window.location.search);
      const requested = params.get("class") || params.get("classId") || params.get("id");
      const resolved = CLASS_ALIASES[requested] || requested;
      return CLASSES[resolved] ? resolved : Object.keys(CLASSES)[0];
    }

    function setClassId(id) {
      const url = new URL(window.location.href);
      url.searchParams.set("class", id);
      history.replaceState(null, "", url);
    }

    function groupStatuses(statusMap) {
      return ICONS.reduce((groups, icon) => {
        const status = normalizeStatus(statusMap[icon.id]);
        groups[status].push(icon);
        return groups;
      }, { green: [], red: [], hidden: [] });
    }

    function normalizeStatus(status) {
      const normalized = String(status || "hidden").trim().toLowerCase();
      if (HIDDEN_STATUSES.has(normalized)) {
        return "hidden";
      }

      if (normalized === "yellow") {
        return "red";
      }

      return ["green", "red"].includes(normalized) ? normalized : "hidden";
    }

    function pyramidPositions(count, anchorX, baseY, direction = 1) {
      const positions = [];
      const spacingX = 60;
      const spacingY = 60;
      let rows = 0;

      while ((rows * (rows + 1)) / 2 < count) {
        rows += 1;
      }

      let remaining = count;
      for (let row = 0; row < rows && remaining > 0; row += 1) {
        const capacity = rows - row;
        const rowCount = Math.min(capacity, remaining);

        for (let i = 0; i < rowCount; i += 1) {
          const x = anchorX + direction * (i - (rowCount - 1) / 2) * spacingX;
          const y = baseY - row * spacingY;
          positions.push({ x, y });
        }

        remaining -= rowCount;
      }

      return positions;
    }

    function columnPositions(count, anchorX, baseY) {
      return Array.from({ length: count }, (_, index) => ({
        x: anchorX,
        y: baseY - index * 60
      }));
    }

    function iconMarkup(icon, status, x, y, year, balanceKey, dropIndex) {
      const safeLabel = `${icon.label}: ${STATUS_LABELS[status]} in ${year}`;
      const dropDelay = 120 + dropIndex * 70;
      return `
        <g transform="translate(${x - 30} ${y - 30})">
          <g class="icon-node" style="--drop-delay: ${dropDelay}ms" tabindex="0" role="button" aria-label="${safeLabel}. Activate to cycle status." data-tip="${safeLabel}" data-icon="${icon.id}" data-balance="${balanceKey}">
            <g class="icon-face">
              <circle class="icon-disc ${status}" cx="30" cy="30" r="30"></circle>
              <svg x="8" y="8" width="44" height="44" viewBox="0 0 100 100">
                <use href="#icon-${icon.id}"></use>
              </svg>
            </g>
          </g>
        </g>
      `;
    }

    function renderBalance(year, balanceKey, statusMap) {
      const groups = groupStatuses(statusMap);
      const greenCount = groups.green.length;
      const redCount = groups.red.length;
      const tilt = Math.max(-12, Math.min(12, (greenCount - redCount) * 2.2));
      const leftPositions = pyramidPositions(redCount, 280, 175, 1);
      const rightPositions = pyramidPositions(greenCount, 720, 175, -1);
      const sideIcons = [
        ...groups.red.map((icon, index) => iconMarkup(icon, "red", leftPositions[index].x, leftPositions[index].y, year, balanceKey, index)),
        ...groups.green.map((icon, index) => iconMarkup(icon, "green", rightPositions[index].x, rightPositions[index].y, year, balanceKey, groups.red.length + index))
      ].join("");

      return `
        <article class="balance" aria-label="${year} balance">
          <svg class="balance-svg" viewBox="0 -125 1000 440" preserveAspectRatio="xMidYMid meet">
            <g class="beam" style="--tilt: ${tilt}deg; --counter-tilt: ${-tilt}deg">
              <line class="beam-line" x1="145" y1="205" x2="855" y2="205"></line>
              <rect class="plate-zone" x="160" y="52" width="260" height="180"></rect>
              <rect class="plate-zone" x="580" y="52" width="260" height="180"></rect>
              ${sideIcons}
            </g>
            <polygon class="fulcrum" points="500,203 426,295 574,295"></polygon>
            <text class="year-label" x="500" y="262">${year}</text>
          </svg>
        </article>
      `;
    }

    function renderDetails(classData) {
      const aggregate = { green: new Set(), red: new Set(), hidden: new Set() };
      ICONS.forEach(icon => aggregate[normalizeStatus(classData.balances.current[icon.id])].add(icon.label));

      detail.innerHTML = ["red", "green", "hidden"].map(status => {
        const items = [...aggregate[status]].sort();
        const body = items.length
          ? `<ul>${items.map(item => `<li>${item}</li>`).join("")}</ul>`
          : `<p>No icons in this category.</p>`;
        return `
          <article class="status-list">
            <h2><span>${STATUS_LABELS[status]}</span><span>${items.length}</span></h2>
            ${body}
          </article>
        `;
      }).join("");
    }

    function render() {
      const classData = CLASSES[activeClassId];
      const currentYear = new Date().getFullYear();
      setClassId(activeClassId);
      board.innerHTML = [
        renderBalance(classData.startYear, "start", classData.balances.start),
        renderBalance(currentYear, "current", classData.balances.current)
      ].join("");
      renderDetails(classData);
      bindTooltips();
      stageBalanceAnimations();
      reportHeight();
    }

    function stageBalanceAnimations() {
      window.clearTimeout(animationTimer);
      const balances = document.querySelectorAll(".balance");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const settleDelay = reduceMotion ? 0 : 1750;

      animationTimer = window.setTimeout(() => {
        balances.forEach(balance => balance.classList.add("settled"));
        reportHeight();
      }, settleDelay);
    }

    function reportHeight() {
      window.cancelAnimationFrame(heightFrame);
      heightFrame = window.requestAnimationFrame(() => {
        const height = Math.ceil(document.documentElement.scrollHeight);
        window.parent.postMessage({
          type: "icon-balances:resize",
          height
        }, "*");
      });
    }

    function bindTooltips() {
      document.querySelectorAll(".icon-node").forEach(node => {
        node.addEventListener("pointerenter", showTip);
        node.addEventListener("pointermove", moveTip);
        node.addEventListener("pointerleave", hideTip);
        node.addEventListener("focus", showTip);
        node.addEventListener("blur", hideTip);
        node.addEventListener("click", cycleIcon);
        node.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            cycleIcon(event);
          }
        });
      });
    }

    function cycleIcon(event) {
      const iconId = event.currentTarget.dataset.icon;
      const balanceKey = event.currentTarget.dataset.balance;
      const statuses = ["red", "green"];
      const statusMap = CLASSES[activeClassId].balances[balanceKey];
      const currentIndex = statuses.indexOf(normalizeStatus(statusMap[iconId]));
      statusMap[iconId] = statuses[(currentIndex + 1) % statuses.length];
      hideTip();
      render();
    }

    function showTip(event) {
      tooltip.textContent = event.currentTarget.dataset.tip;
      moveTip(event);
      tooltip.classList.add("visible");
    }

    function moveTip(event) {
      const x = event.clientX || window.innerWidth / 2;
      const y = event.clientY || 140;
      tooltip.style.left = `${x}px`;
      tooltip.style.top = `${y}px`;
    }

    function hideTip() {
      tooltip.classList.remove("visible");
    }

    new ResizeObserver(reportHeight).observe(document.documentElement);
    window.addEventListener("load", reportHeight);
    window.addEventListener("resize", reportHeight);
    window.addEventListener("message", event => {
      if (event.data?.type === "icon-balances:request-height") {
        reportHeight();
      }
    });
    document.fonts?.ready.then(reportHeight);

    render();
  </script>
</body>
</html>
